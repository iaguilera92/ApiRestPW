trigger: none

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: PruebasQAS
    displayName: "Pruebas QAS (con error)"
    jobs:
      - job: Tests
        displayName: "Ejecutar tests"
        steps:
          - task: UseNode@1
            inputs:
              version: "20.x"
            displayName: "Instalar Node.js 20"

          - script: cd backend && npm ci
            displayName: "Instalar dependencias"

          - script: cd backend && npx jest --verbose tests/trabajos-error.test.ts tests/trabajos.test.ts
            displayName: "Ejecutar pruebas automatizadas"
            env:
              SUPABASE_URL: $(SUPABASE_URL)
              SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
              GROQ_API_KEY: $(GROQ_API_KEY)
              REDIS_URL: $(REDIS_URL)
              PORT: "3000"
              MOCK_AI: "true"
              SIMULATE_OPENAI_DOWN: "false"
              SIMULATE_PHONE: "false"
              NODE_ENV: "test"
              WHATSAPP_TOKEN: "test"
              WHATSAPP_VERIFY_TOKEN: "test"
              WHATSAPP_PHONE_NUMBER_ID: "test"
              SMTP_HOST: "test"
              SMTP_PORT: "587"
              SMTP_USER: "test"
              SMTP_PASS: "test"
              SMTP_FROM: "test@test.cl"
              BREVO_API_KEY: "test"
              AWS_ACCESS_KEY_ID: "test"
              AWS_SECRET_ACCESS_KEY: "test"
              AWS_REGION: "us-east-1"
              BUCKET_NAME: "test"

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "backend/test-results/junit.xml"
              testRunTitle: "Pruebas QAS - Error simulado"
            displayName: "Publicar resultados"
            condition: always()

          - script: |
              node -e "
              const fs = require('fs');
              const xml = fs.readFileSync('backend/test-results/junit.xml', 'utf8');
              const tests = xml.match(/<testcase[^>]*\/?>[\s\S]*?(<\/testcase>|(?=<testcase|<\/testsuite))/g) || [];
              const detalle = tests.map(tc => {
                const names = tc.match(/name=\"([^\"]+)\"/g) || []; const name = names.length > 1 ? names[1].match(/\"([^\"]+)\"/)[1] : (names[0] || '').replace(/name=\"|\"$/g, '');
                const time = parseFloat((tc.match(/time=\"([^\"]+)\"/) || [])[1] || '0');
                const failed = /<failure/.test(tc);
                const errorMsg = failed ? (tc.match(/<failure[^>]*>([\s\S]*?)<\/failure>/) || [])[1] || '' : undefined;
                return { nombre: name, estado: failed ? 'failed' : 'passed', duracion_ms: Math.round(time * 1000), ...(errorMsg && { error: errorMsg.trim() }) };
              });
              const passed = detalle.filter(d => d.estado === 'passed').length;
              const failed = detalle.filter(d => d.estado === 'failed').length;
              const totalTime = detalle.reduce((sum, d) => sum + d.duracion_ms, 0);
              const body = JSON.stringify({
                pipeline_id: process.env.BUILD_ID,
                estado: failed > 0 ? 'failed' : 'passed',
                total_tests: detalle.length,
                tests_passed: passed,
                tests_failed: failed,
                duracion_ms: totalTime,
                detalle: detalle,
                origen: 'azure'
              });
              const https = require('https');
              const req = https.request(process.env.API_URL + '/api/pruebas-qas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => { let r=''; res.on('data',c=>r+=c); res.on('end',()=>console.log('Resultado guardado:', r)); });
              req.on('error', e => console.error('Error:', e.message));
              req.write(body);
              req.end();
              "
            displayName: "Guardar resultados en BD"
            condition: always()
            env:
              API_URL: $(API_URL)
              BUILD_ID: $(Build.BuildId)
