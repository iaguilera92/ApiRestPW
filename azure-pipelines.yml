trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
      checkLatest: true
    displayName: "Install Node.js 20"

  - script: node --version && npm --version
    displayName: "Verificar versión Node"

  - script: cd backend && npm ci
    displayName: "Instalar dependencias"

  - script: cd backend && npm test
    displayName: "Ejecutar tests"
    env:
      SUPABASE_URL: $(SUPABASE_URL)
      SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
