trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
      checkLatest: true
    displayName: "Install Node.js 20"

  - script: node --version && npm --version
    displayName: "Verificar versión Node"

  - script: cd backend && npm ci
    displayName: "Instalar dependencias"

  - script: cd backend && npm test
    displayName: "Ejecutar tests"
    env:
      SUPABASE_URL: $(SUPABASE_URL)
      SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
      GROQ_API_KEY: $(GROQ_API_KEY)
      REDIS_URL: $(REDIS_URL)
      PORT: "3000"
      MOCK_AI: "true"
      SIMULATE_OPENAI_DOWN: "false"
      SIMULATE_PHONE: "false"
      NODE_ENV: "test"
      WHATSAPP_TOKEN: "test"
      WHATSAPP_VERIFY_TOKEN: "test"
      WHATSAPP_PHONE_NUMBER_ID: "test"
      SMTP_HOST: "test"
      SMTP_PORT: "587"
      SMTP_USER: "test"
      SMTP_PASS: "test"
      SMTP_FROM: "test@test.cl"
      BREVO_API_KEY: "test"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "us-east-1"
      BUCKET_NAME: "test"
